<p>

<br>

<button onclick="saveNote()">
Simpan

<script>

const note=
localStorage.getItem("domus_note");

if(note){
document.getElementById("note").value=note;
}

function saveNote(){

localStorage.setItem(
"domus_note",
document.getElementById("note").value
);

alert("Catatan disimpan.");

}

</script>
