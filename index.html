<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Catatan Penjelajah</title>

<style>

body{
background:#111;
color:white;
font-family:Georgia;
padding:30px;
}

textarea{
width:100%;
height:200px;
padding:15px;
}

button{
padding:12px 20px;
margin-top:10px;
}

</style>

</head>

<body>

<h1>Catatan Penjelajah</h1>

<p>
Apa yang paling mengganggumu dari perjalanan ini?
</p>

<textarea id="note"></textarea>

<br>

<button onclick="saveNote()">
Simpan
</button>

<script>

const note=
localStorage.getItem("domus_note");

if(note){
document.getElementById("note").value=note;
}

function saveNote(){

localStorage.setItem(
"domus_note",
document.getElementById("note").value
);

alert("Catatan disimpan.");

}

</script>

</body>
</html>
